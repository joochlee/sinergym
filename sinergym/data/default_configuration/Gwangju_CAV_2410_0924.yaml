# Documentation: https://ugr-sail.github.io/sinergym/compilation/main/pages/environments_registration.html
# ---------------------------------------------------------------------------- #
#                        ID BASE FROM ENVIRONMNET NAMES                        #
# ---------------------------------------------------------------------------- #
id_base: CompassCAV

# ---------------------------------------------------------------------------- #
#                         BUILDING AND WEATHER SETTINGS                        #
# ---------------------------------------------------------------------------- #
building_file: Gwangju_CAV_2410_0924.epJSON

# A environment alternative for each weather key
weather_specification:
  weather_files:
    - KOR_KJ_Gwangju.471560_TMYx.2009-2023.epw
  keys:
    - normal

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
building_config:
  timesteps_per_hour: 3

seed: 321

# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #
# Alternative stochastic environments if it is defined
weather_variability:
  Dry Bulb Temperature:
    - 1.0 # sigma
    - 0.0 # mu
    - 24.0 # tau

# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #

# --------------- TIME VARIABLES (same name as EnergyPlus API) --------------- #
time_variables:
  - month
  - day_of_month
  - hour
# More variables in Data Transfer API: https://energyplus.readthedocs.io/en/latest/datatransfer.html

# ----------------------------- OUTPUT:VARIABLES ----------------------------- #
variables:
  # 존, 온도, 습도, CO2
  Zone Mean Air temperature:
    variable_names: mean_air_temperature
    keys:
      - ATTIC
      - CORE_ZN
      - PERIMETER_ZN_1
      - PERIMETER_ZN_2
      - PERIMETER_ZN_3
      - PERIMETER_ZN_4
  Zone Air Relative Humidity:
    variable_names: air_relative_humidity
    keys: 
      - ATTIC
      - CORE_ZN
      - PERIMETER_ZN_1
      - PERIMETER_ZN_2
      - PERIMETER_ZN_3
      - PERIMETER_ZN_4
  Zone Air CO2 Concentration:
    variable_names: air_co2_concentration
    keys:
      - ATTIC
      - CORE_ZN
      - PERIMETER_ZN_1
      - PERIMETER_ZN_2
      - PERIMETER_ZN_3
      - PERIMETER_ZN_4
  # 외부 기상 조건
  Site Outdoor Air Drybulb temperature:
    variable_names: outdoor_air_drybulb_temperature
    keys: Environment
  Site Outdoor Air Relative Humidity:
    variable_names: outdoor_air_relative_humidity
    keys: Environment
  Site Direct Solar Radiation Rate per Area:
    variable_names: direct_solar_radiation_rate_per_area
    keys: Environment
  Site Wind Speed:
    variable_names: wind_speed
    keys: Environment
  # 재실자 수 및 스케줄
  Zone People Occupant Count:
    variable_names: people_occupant_count
    keys: 
      - CORE_ZN
      - PERIMETER_ZN_1
      - PERIMETER_ZN_2
      - PERIMETER_ZN_3
      - PERIMETER_ZN_4
  # 에너지 소비량 모니터링
  Facility Total Electricity Demand Rate:
    variable_names: total_electricity_demand_rate
    keys: Whole Building
  Air System Total Cooling Energy:
    variable_names: air_system_total_cooling_energy
    keys:
      - PSZ-AC:1
      - PSZ-AC:2
      - PSZ-AC:3
      - PSZ-AC:4
      - PSZ-AC:5
  Air System Total Heating Energy:
    variable_names: air_system_total_cooling_energy
    keys:
      - PSZ-AC:1
      - PSZ-AC:2
      - PSZ-AC:3
      - PSZ-AC:4
      - PSZ-AC:5
  # 실내쾌적도
  # Zone Thermal Comfort Fanger Model PPD, 
  # Zone Thermal Comfort Fanger Model PMV는 출력변수에 없음

# ------------------------------- OUTPUT:METERS ------------------------------ #
meters:
  Electricity:HVAC: total_electricity_HVAC

# ---------------------------------------------------------------------------- #
#                               ACTION VARIABLES                               #
# ---------------------------------------------------------------------------- #

# --------------------------- ACTUATORS TO CONTROL --------------------------- #
actuators:
  # CAV 각 존 온도 설정값
  # 히팅 온도 스케줄
  HTGSETP_SCH_NO_OPTIMUM:
    variable_name: Heating_Setpoint_RL
    element_type: Schedule:Compact
    value_type: Schedule Value
  # 쿨링 온도 스케줄
  CLGSETP_SCH_NO_OPTIMUM:
    variable_name: Cooling_Setpoint_RL
    element_type: Schedule:Compact
    value_type: Schedule Value
  
  # CAV 시스템 On/Off
  HVACOPERATIONSCHD:
    variable_name: hvac_operation_RL
    element_type: Schedule:Compact
    value_type: Schedule Value
  

# ---------------------------------------------------------------------------- #
#                   DYNAMIC CONTEXT CONFIGURABLE IN REAL-TIME                  #
# ---------------------------------------------------------------------------- #
context: {}

# ---------------------------------------------------------------------------- #
#                                 ACTIONS SPACE                                #
# ---------------------------------------------------------------------------- #
action_space: gym.spaces.Box(low=np.array([12.0, 23.25, 0.0], dtype=np.float32), high=np.array([23.25, 30.0, 1.0], dtype=np.float32), shape=(3,), dtype=np.float32)

# action_space_discrete: gym.spaces.Discrete(10)

# ---------------------------------------------------------------------------- #
#                                REWARD FUNCTION                               #
# ---------------------------------------------------------------------------- #
reward: sinergym.utils.rewards:LinearReward

reward_kwargs:
  temperature_variables:
    - attic_mean_air_temperature
    - core_zn_mean_air_temperature
    - perimeter_zn_1_mean_air_temperature
    - perimeter_zn_2_mean_air_temperature
    - perimeter_zn_3_mean_air_temperature
    - perimeter_zn_4_mean_air_temperature
  energy_variables:
    - total_electricity_demand_rate
  range_comfort_winter:
    - 20.0
    - 23.5
  range_comfort_summer:
    - 23.0
    - 26.0
  summer_start:
    - 6
    - 1
  summer_final:
    - 9
    - 30
  # 1. 전력소모 == 열쾌적성
  # energy_weight: 0.5
  # 2. 전력소모에 더 중점
  # energy_weight: 0.7
  # 3. 열쾌적성에 더 중점
  energy_weight: 0.3
  lambda_energy: 1.0e-4
  lambda_temperature: 1.0
