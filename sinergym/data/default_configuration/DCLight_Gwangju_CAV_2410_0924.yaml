# Documentation: https://ugr-sail.github.io/sinergym/compilation/main/pages/environments_registration.html
# ---------------------------------------------------------------------------- #
#                        ID BASE FROM ENVIRONMNET NAMES                        #
# ---------------------------------------------------------------------------- #
id_base: DCLight

# ---------------------------------------------------------------------------- #
#                         BUILDING AND WEATHER SETTINGS                        #
# ---------------------------------------------------------------------------- #
building_file: DCLight_Gwangju_CAV_2410_0924.epJSON

# A environment alternative for each weather key
weather_specification:
  weather_files:
    - KOR_KJ_Gwangju.471560_TMYx.2009-2023.epw
  keys:
    - normal

# ---------------------------------------------------------------------------- #
#                         BUILDING EXTRA CONFIGURATION                         #
# ---------------------------------------------------------------------------- #
# 3 인 경우 1 에피소드 당 step 수 (1년치 step 수) : 3 x 24 x 365 = 26,280 
# 보상이 안정되는 스텝수 : 대략 2,000,000 steps = 대략 100 에피소드 정도
building_config:
  timesteps_per_hour: 3

seed: 321

# ---------------------------------------------------------------------------- #
#                        WEATHER VARIABILITY (OPTIONAL)                        #
# ---------------------------------------------------------------------------- #
# Alternative stochastic environments if it is defined
weather_variability:
  Dry Bulb Temperature:
    - 1.0 # sigma
    - 0.0 # mu
    - 24.0 # tau

# ---------------------------------------------------------------------------- #
#                          EPISODES FOLDER GENERATION                          #
# ---------------------------------------------------------------------------- #
max_ep_store: 3

# ---------------------------------------------------------------------------- #
#                             OBSERVATION VARIABLES                            #
# ---------------------------------------------------------------------------- #

# --------------- TIME VARIABLES (same name as EnergyPlus API) --------------- #
time_variables:
  - month
  - day_of_month
  - hour
# More variables in Data Transfer API: https://energyplus.readthedocs.io/en/latest/datatransfer.html

# ----------------------------- OUTPUT:VARIABLES ----------------------------- #
variables:
  # 현재 조명 소모 전력
  Lights Electricity Rate:
    variable_names: lights_electricity_rate
    keys:
      - CORE_ZN_LIGHTS

# ------------------------------- OUTPUT:METERS ------------------------------ #
meters:
  Electricity:HVAC: total_electricity_HVAC

# ---------------------------------------------------------------------------- #
#                               ACTION VARIABLES                               #
# ---------------------------------------------------------------------------- #

# --------------------------- ACTUATORS TO CONTROL --------------------------- #
actuators:
  # 조명 스케줄
  ltg_sch_office:
    variable_name: Lighting_Setpoint_RL
    element_type: Schedule:Compact
    value_type: Schedule Value

# ---------------------------------------------------------------------------- #
#                   DYNAMIC CONTEXT CONFIGURABLE IN REAL-TIME                  #
# ---------------------------------------------------------------------------- #
context: {}

# ---------------------------------------------------------------------------- #
#                                 ACTIONS SPACE                                #
# ---------------------------------------------------------------------------- #
# action_space: gym.spaces.Box(low=np.array([12.0, 23.25, 0.0], dtype=np.float32), high=np.array([23.25, 30.0, 1.0], dtype=np.float32), shape=(3,), dtype=np.float32)
action_space: gym.spaces.Box(low=np.array([0.0], dtype=np.float32), high=np.array([1.0], dtype=np.float32), shape=(1,), dtype=np.float32)

# action_space_discrete: gym.spaces.Discrete(10)

# ---------------------------------------------------------------------------- #
#                                REWARD FUNCTION                               #
# ---------------------------------------------------------------------------- #
reward: sinergym.utils.rewards:LinearReward4Light

reward_kwargs:
  # temperature_variables:
  #   - attic_mean_air_temperature
  #   - core_zn_mean_air_temperature
  #   - perimeter_zn_1_mean_air_temperature
  #   - perimeter_zn_2_mean_air_temperature
  #   - perimeter_zn_3_mean_air_temperature
  #   - perimeter_zn_4_mean_air_temperature
  
  energy_variables:
    - core_zn_lights_lights_electricity_rate
    # - total_electricity_demand_rate
  
  # range_comfort_winter:
  #   - 20.0
  #   - 23.5
  # range_comfort_summer:
  #   - 23.0
  #   - 26.0
  # summer_start:
  #   - 6
  #   - 1
  # summer_final:
  #   - 9
  #   - 30

  # 조명밝기 하한선
  min_dim: 0.6

  # ess 용량
  # 200,000 Wh 로 가정
  ess_total: 40000.0

  # 최소 SoC
  min_soc : 0.1

  # ESS 사용 가중치
  ess_weight: 1.0

  # ESS SoC 하향 페널티 가중치
  # ess_soc_weight: 6
  # ess_soc_weight: 2
  ess_soc_weight: 1

  # grid 사용 페널티 가중치
  # grid_weight: 8
  # grid_weight: 3
  grid_weight: 1

  # 최소 dimming 하향 페넡티 가중치
  # dim_weight: 1
  # dim_weight: 15
  # dim_weight: 10.0
  dim_weight: 2.0

  # 내부변수 "Lighting Power Design Level"의 설정값. (단위 : w)
  # 이 값은 lights 객체의 Lighting Level 속성값에 해당함
  # 1 step 을 20분으로 했으면, 매 스텝별 소모전력은 대략 (lights_electricity_rate x 1/3) KWh 임
  # 원래는 python api를 통해서 내부변수의 값을 읽어와야 하나 일단 급해서 여기에 값을 적어둠 (2025-11-13)
  lighting_power_design_level : 1000.0

  # 2. 전력소모에 더 중점
  # energy_weight: 0.7
  # 3. 열쾌적성에 더 중점
  # energy_weight: 0.3
  
  
  lambda_energy: 1.0e-3
  lambda_temperature: 1.0
